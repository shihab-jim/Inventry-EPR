services:
  - type: web
    name: smartstock-erp
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn smartstock.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartstock-db
          property: connectionString

databases:
  - name: smartstock-db
    plan: free
    databaseName: smartstock
    user: smartstock_user

