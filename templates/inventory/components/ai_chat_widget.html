<!-- AI Chat Widget — floating assistant bubble + chat panel -->
<div id="aiChatWidget">
  <!-- Floating toggle button -->
  <button id="aiChatToggle" class="ai-chat-toggle" title="AI Inventory Assistant" aria-label="Open AI assistant">
    <i class="bi bi-robot"></i>
    <span class="ai-pulse"></span>
  </button>

  <!-- Chat panel -->
  <div id="aiChatPanel" class="ai-chat-panel" style="display:none">
    <div class="ai-chat-header">
      <div class="ai-chat-header-info">
        <div class="ai-avatar"><i class="bi bi-robot"></i></div>
        <div>
          <strong>SmartStock AI</strong>
          <small>Powered by Gemini</small>
        </div>
      </div>
      <div class="ai-chat-header-actions">
        <button id="aiChatClear" class="ai-header-btn" title="Clear conversation"><i class="bi bi-arrow-counterclockwise"></i></button>
        <button id="aiChatClose" class="ai-header-btn" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div id="aiChatMessages" class="ai-chat-messages">
      <!-- Welcome message -->
      <div class="ai-msg ai-msg-bot">
        <div class="ai-msg-avatar"><i class="bi bi-robot"></i></div>
        <div class="ai-msg-bubble">
          <p>👋 Hi! I'm your <strong>SmartStock AI Assistant</strong>. I can help you with:</p>
          <ul>
            <li>Inventory status &amp; stock levels</li>
            <li>Product insights &amp; recommendations</li>
            <li>Requisition &amp; order tracking</li>
            <li>Stock movement analysis</li>
          </ul>
          <p>Ask me anything about your inventory!</p>
        </div>
      </div>
    </div>

    <!-- Suggested questions -->
    <div id="aiSuggestions" class="ai-suggestions">
      <button class="ai-suggestion-chip" data-q="Give me an overview of my inventory status">📊 Inventory overview</button>
      <button class="ai-suggestion-chip" data-q="Which products are running low or out of stock?">⚠️ Low stock alerts</button>
      <button class="ai-suggestion-chip" data-q="What are my top products by inventory value?">💰 Top products</button>
      <button class="ai-suggestion-chip" data-q="Summarize recent stock movements from the last 7 days">📦 Recent movements</button>
    </div>

    <form id="aiChatForm" class="ai-chat-input-area">
      <input type="text" id="aiChatInput" class="ai-chat-input" placeholder="Ask about your inventory..." autocomplete="off" maxlength="1000">
      <button type="submit" id="aiChatSend" class="ai-chat-send" title="Send"><i class="bi bi-send-fill"></i></button>
    </form>
  </div>
</div>

<style>
/* ── AI Chat Widget ─────────────────────────────── */
.ai-chat-toggle {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 9999;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #7c5cfc, #5533c7);
  color: #fff;
  font-size: 26px;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(101, 80, 234, 0.45);
  transition: transform 0.2s, box-shadow 0.2s;
}
.ai-chat-toggle:hover { transform: scale(1.08); box-shadow: 0 10px 34px rgba(101, 80, 234, 0.55); }
.ai-pulse {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(124, 92, 252, 0.4);
  animation: ai-pulse-anim 2s ease-out infinite;
  pointer-events: none;
}
@keyframes ai-pulse-anim {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* Chat panel */
.ai-chat-panel {
  position: fixed;
  bottom: 100px;
  right: 28px;
  z-index: 9998;
  width: 400px;
  max-width: calc(100vw - 40px);
  height: 560px;
  max-height: calc(100vh - 130px);
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(25, 22, 60, 0.22), 0 0 0 1px rgba(101, 80, 234, 0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: ai-panel-in 0.25s ease-out;
}
@keyframes ai-panel-in {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Header */
.ai-chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(135deg, #7c5cfc, #5a3ad4);
  color: #fff;
  flex-shrink: 0;
}
.ai-chat-header-info { display: flex; align-items: center; gap: 10px; }
.ai-chat-header-info strong { display: block; font-size: 14px; font-weight: 700; }
.ai-chat-header-info small { display: block; font-size: 10px; opacity: 0.8; }
.ai-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,0.2); display: grid; place-items: center;
  font-size: 20px;
}
.ai-chat-header-actions { display: flex; gap: 4px; }
.ai-header-btn {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  width: 32px; height: 32px; border-radius: 8px; font-size: 14px;
  cursor: pointer; display: grid; place-items: center; transition: background 0.15s;
}
.ai-header-btn:hover { background: rgba(255,255,255,0.3); }

/* Messages area */
.ai-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: #ddd transparent;
}
.ai-msg { display: flex; gap: 8px; max-width: 100%; }
.ai-msg-bot { align-items: flex-start; }
.ai-msg-user { align-items: flex-start; flex-direction: row-reverse; }
.ai-msg-avatar {
  width: 28px; height: 28px; border-radius: 8px; flex: 0 0 28px;
  display: grid; place-items: center; font-size: 14px;
}
.ai-msg-bot .ai-msg-avatar { background: #f0edff; color: #6750f3; }
.ai-msg-user .ai-msg-avatar { background: #e8f8ee; color: #198e57; }
.ai-msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 12.5px;
  line-height: 1.55;
  max-width: 85%;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-msg-bot .ai-msg-bubble {
  background: #f7f6fd;
  color: #2d2d3f;
  border-top-left-radius: 4px;
}
.ai-msg-user .ai-msg-bubble {
  background: linear-gradient(135deg, #6750f3, #5a3ad4);
  color: #fff;
  border-top-right-radius: 4px;
}
.ai-msg-bubble p { margin: 0 0 6px; }
.ai-msg-bubble p:last-child { margin-bottom: 0; }
.ai-msg-bubble ul { margin: 4px 0 6px; padding-left: 18px; }
.ai-msg-bubble li { margin-bottom: 3px; }
.ai-msg-bubble strong { font-weight: 700; }
.ai-msg-bubble code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 4px; font-size: 11px; }

/* Typing indicator */
.ai-typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.ai-typing-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #b0a8e0;
  animation: ai-typing-bounce 1.2s ease-in-out infinite;
}
.ai-typing-dot:nth-child(2) { animation-delay: 0.15s; }
.ai-typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes ai-typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Suggestions */
.ai-suggestions {
  padding: 6px 14px 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  border-top: 1px solid #f0f0f7;
  flex-shrink: 0;
}
.ai-suggestion-chip {
  background: #f7f5ff;
  border: 1px solid #e8e4ff;
  color: #5a42d4;
  font-size: 10.5px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 18px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.ai-suggestion-chip:hover {
  background: #ece8ff;
  border-color: #d4cdff;
}

/* Input area */
.ai-chat-input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid #f0f0f7;
  background: #fcfcff;
  flex-shrink: 0;
}
.ai-chat-input {
  flex: 1;
  border: 1px solid #e5e5f0;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 12.5px;
  outline: none;
  background: #fff;
  color: #2d2d3f;
  transition: border-color 0.15s;
}
.ai-chat-input:focus { border-color: #9484ff; box-shadow: 0 0 0 3px rgba(101,80,234,0.08); }
.ai-chat-input::placeholder { color: #b0b5c5; }
.ai-chat-send {
  width: 40px; height: 40px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #7c5cfc, #5533c7);
  color: #fff; font-size: 16px; cursor: pointer;
  display: grid; place-items: center;
  transition: transform 0.15s, opacity 0.15s;
  flex-shrink: 0;
}
.ai-chat-send:hover { transform: scale(1.05); }
.ai-chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Mobile adjustments */
@media (max-width: 480px) {
  .ai-chat-panel { width: calc(100vw - 20px); right: 10px; bottom: 90px; height: calc(100vh - 110px); }
  .ai-chat-toggle { bottom: 20px; right: 20px; width: 52px; height: 52px; font-size: 23px; }
}
</style>

<script>
(function() {
  const toggle = document.getElementById('aiChatToggle');
  const panel = document.getElementById('aiChatPanel');
  const closeBtn = document.getElementById('aiChatClose');
  const clearBtn = document.getElementById('aiChatClear');
  const form = document.getElementById('aiChatForm');
  const input = document.getElementById('aiChatInput');
  const sendBtn = document.getElementById('aiChatSend');
  const msgContainer = document.getElementById('aiChatMessages');
  const suggestions = document.getElementById('aiSuggestions');

  let isOpen = false;
  let conversationHistory = [];
  let isWaiting = false;

  // CSRF token
  function getCSRF() {
    const cookie = document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '';
  }

  // Toggle panel
  toggle.addEventListener('click', () => {
    isOpen = !isOpen;
    panel.style.display = isOpen ? 'flex' : 'none';
    if (isOpen) { input.focus(); toggle.querySelector('.ai-pulse').style.display = 'none'; }
    else { toggle.querySelector('.ai-pulse').style.display = ''; }
  });

  closeBtn.addEventListener('click', () => {
    isOpen = false;
    panel.style.display = 'none';
    toggle.querySelector('.ai-pulse').style.display = '';
  });

  // Clear conversation
  clearBtn.addEventListener('click', () => {
    conversationHistory = [];
    msgContainer.innerHTML = `
      <div class="ai-msg ai-msg-bot">
        <div class="ai-msg-avatar"><i class="bi bi-robot"></i></div>
        <div class="ai-msg-bubble">
          <p>🔄 Conversation cleared. How can I help you?</p>
        </div>
      </div>`;
    suggestions.style.display = 'flex';
  });

  // Suggestion chips
  suggestions.addEventListener('click', (e) => {
    const chip = e.target.closest('.ai-suggestion-chip');
    if (chip) {
      const q = chip.dataset.q;
      input.value = q;
      sendMessage(q);
    }
  });

  // Simple markdown → HTML
  function renderMarkdown(text) {
    // Escape HTML
    let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Unordered lists
    html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Paragraphs
    html = html.replace(/\n{2,}/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>\s*<\/p>/g, '');
    return html;
  }

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `ai-msg ai-msg-${role === 'user' ? 'user' : 'bot'}`;
    const icon = role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-robot"></i>';
    const bubbleContent = role === 'user' ? `<p>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>` : renderMarkdown(content);
    div.innerHTML = `
      <div class="ai-msg-avatar">${icon}</div>
      <div class="ai-msg-bubble">${bubbleContent}</div>`;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'ai-msg ai-msg-bot';
    div.id = 'aiTyping';
    div.innerHTML = `
      <div class="ai-msg-avatar"><i class="bi bi-robot"></i></div>
      <div class="ai-msg-bubble">
        <div class="ai-typing">
          <div class="ai-typing-dot"></div>
          <div class="ai-typing-dot"></div>
          <div class="ai-typing-dot"></div>
        </div>
      </div>`;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('aiTyping');
    if (t) t.remove();
  }

  async function sendMessage(message) {
    if (isWaiting || !message.trim()) return;
    isWaiting = true;
    sendBtn.disabled = true;
    input.value = '';
    suggestions.style.display = 'none';

    addMessage('user', message);
    conversationHistory.push({ role: 'user', content: message });
    showTyping();

    try {
      const res = await fetch("{% url 'inventory:ai_chat' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRF(),
        },
        body: JSON.stringify({
          message: message,
          history: conversationHistory.slice(-10),
        }),
      });
      const data = await res.json();
      removeTyping();

      if (data.reply) {
        addMessage('bot', data.reply);
        conversationHistory.push({ role: 'assistant', content: data.reply });
      } else if (data.error) {
        addMessage('bot', '⚠️ ' + data.error);
      }
    } catch (err) {
      removeTyping();
      addMessage('bot', '❌ Network error. Please check your connection and try again.');
    }

    isWaiting = false;
    sendBtn.disabled = false;
    input.focus();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  // Global helper for opening the chat widget with a prompt
  window.askSmartStockAI = function(question) {
    if (!isOpen) {
      isOpen = true;
      panel.style.display = 'flex';
      const pulse = toggle.querySelector('.ai-pulse');
      if (pulse) pulse.style.display = 'none';
    }
    if (question && question.trim()) {
      sendMessage(question.trim());
    } else {
      input.focus();
    }
  };
})();
</script>
